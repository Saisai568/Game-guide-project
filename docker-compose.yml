# game-guide-project/docker-compose.yml

services:
  # 1. Laravel PHP-FPM 服務
  php:
    build:
      context: ./backend # 使用 backend/Dockerfile
      dockerfile: Dockerfile
    image: laravel-php
    container_name: laravel-php
    restart: unless-stopped
    tty: true
    volumes:
      - ./backend:/var/www/html # 掛載後端代碼
      - ./backend/storage:/var/www/html/storage # 確保 storage 權限
    working_dir: /var/www/html
    networks:
      - app-network

  # 2. Nginx Web 伺服器服務
  nginx:
    image: nginx:stable-alpine
    container_name: laravel-nginx
    restart: unless-stopped
    tty: true
    ports:
      - "80:80" # 映射主機 80 埠
    volumes:
      - ./backend:/var/www/html # 掛載後端代碼
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro # 掛載 Nginx 配置
    networks:
      - app-network

  # 3. React 開發伺服器 (可選，通常在主機上運行)
  # 建議在主機上運行 `npm run dev` 以獲得熱重載，這裡僅作示意
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5173:5173"
  #   ...

networks:
  app-network:
    driver: bridge